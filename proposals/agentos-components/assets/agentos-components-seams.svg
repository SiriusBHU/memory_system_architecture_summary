<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2937">AgentOS 四组件、立场与八条接缝</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#6b7280">方框内为我方立场编号；连线上的 J1–J8 为跨组件接缝（主责组件见正文）；方框底部为本轮调研的一句话结论</text>

  <!-- Caller band -->
  <rect x="20" y="72" width="740" height="40" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="390" y="97" text-anchor="middle" font-size="13.5" fill="#374151"><tspan font-weight="700">Agent / 应用（调用方）</tspan>：经 L0 / L1 接口发起动作 · 经推理服务调用模型 · 经记忆框架读写记忆</text>

  <!-- ========== Inference (top-left) ========== -->
  <rect x="20" y="130" width="310" height="190" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="20" y="130" width="310" height="32" rx="8" fill="#2563eb"/>
  <rect x="20" y="150" width="310" height="12" fill="#2563eb"/>
  <text x="175" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">推理框架与推理能力 · 对应调度器</text>
  <g font-size="12.5" fill="#1e3a8a">
    <text x="34" y="184">INF-1 模型即系统服务</text>
    <text x="34" y="204">INF-2 共享底座 + 适配器热插拔</text>
    <text x="34" y="224">INF-3 多租户 QoS 调度</text>
    <text x="34" y="244">INF-4 端云路由层</text>
    <text x="34" y="264">INF-5 权重 / KV 可分页（框架侧支持）</text>
  </g>
  <line x1="34" y1="278" x2="316" y2="278" stroke="#bfdbfe"/>
  <text id="c1-finding" x="34" y="298" font-size="12" fill="#1d4ed8">结论：共享底座已量产，但只是受限共享；</text>
  <text id="c1-finding2" x="34" y="314" font-size="12" fill="#1d4ed8">NPU 抽象看分发通道，调度到模型级抢占</text>

  <!-- ========== Sandbox (top-right) ========== -->
  <rect x="450" y="130" width="310" height="190" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <rect x="450" y="130" width="310" height="32" rx="8" fill="#7c3aed"/>
  <rect x="450" y="150" width="310" height="12" fill="#7c3aed"/>
  <text x="605" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">沙箱框架与执行能力 · 对应进程与保护环</text>
  <g font-size="12.5" fill="#5b21b6">
    <text x="464" y="184">SBX-1 借来的隔离边界</text>
    <text x="464" y="204">SBX-2/3 L0 + L1 接口面、七要素</text>
    <text x="464" y="224">SBX-4/5 参数化权限、三维定档</text>
    <text x="464" y="244">SBX-6/7 三时机执行、跨链不升级</text>
    <text x="464" y="264">SBX-8/9 凭证经纪人、身份归应用</text>
  </g>
  <line x1="464" y1="278" x2="746" y2="278" stroke="#ddd6fe"/>
  <text id="c2-finding" x="464" y="298" font-size="12" fill="#6d28d9">结论：手机缺会话生命周期层；一半事件</text>
  <text id="c2-finding2" x="464" y="314" font-size="12" fill="#6d28d9">用合法权限，权限衰减外还需信息流标签</text>

  <!-- ========== Memory management (bottom-left) ========== -->
  <rect x="20" y="420" width="310" height="190" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <rect x="20" y="420" width="310" height="32" rx="8" fill="#d97706"/>
  <rect x="20" y="440" width="310" height="12" fill="#d97706"/>
  <text x="175" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">内存管理 · 对应虚拟内存</text>
  <g font-size="12.5" fill="#92400e">
    <text x="34" y="474">MM-1 统一记账（dma-buf + 会话 memcg + PSI）</text>
    <text x="34" y="494">MM-2 双策略域（传统 / 模型）</text>
    <text x="34" y="514">MM-3 QoS 跟用户注意力</text>
    <text x="34" y="534">MM-4/5/6 KV 经济学、MoE 专家、权重分页</text>
    <text x="34" y="554">MM-7 四种驱逐去向互通</text>
  </g>
  <line x1="34" y1="568" x2="316" y2="568" stroke="#fde68a"/>
  <text id="c4-finding" x="34" y="588" font-size="12" fill="#b45309">结论：模型内存经 dma-buf 绕过限额与归属；</text>
  <text id="c4-finding2" x="34" y="604" font-size="12" fill="#b45309">回收以可恢复为先，去向扩为六档决策树</text>

  <!-- ========== Memory framework (bottom-right) ========== -->
  <rect x="450" y="420" width="310" height="190" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="450" y="420" width="310" height="32" rx="8" fill="#059669"/>
  <rect x="450" y="440" width="310" height="12" fill="#059669"/>
  <text x="605" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">记忆框架与记忆能力 · 对应文件系统</text>
  <g font-size="12.5" fill="#065f46">
    <text x="464" y="474">MEM-1 存储 / 索引 / ACL / 共享（inode）</text>
    <text x="464" y="494">MEM-2 记忆策略归 Agent</text>
    <text x="464" y="514">MEM-3 有损驱逐接口（摘要入库）</text>
    <text x="464" y="534">MEM-4 个人上下文统一索引 + 细粒度授权</text>
  </g>
  <line x1="464" y1="568" x2="746" y2="568" stroke="#bbf7d0"/>
  <text id="c3-finding" x="464" y="588" font-size="12" fill="#047857">结论：记忆在文件化；OS 的发力点是来源</text>
  <text id="c3-finding2" x="464" y="604" font-size="12" fill="#047857">标签、写入授权与跨副本级联删除</text>

  <!-- ========== Seams ========== -->
  <g stroke="#6b7280" stroke-width="1.6" fill="none">
    <line x1="330" y1="225" x2="450" y2="225"/>
    <line x1="330" y1="515" x2="450" y2="515"/>
    <line x1="100" y1="320" x2="100" y2="420"/>
    <line x1="720" y1="320" x2="720" y2="420"/>
    <line x1="470" y1="320" x2="310" y2="420" stroke-dasharray="5,4"/>
  </g>
  <g font-size="11.5">
    <!-- inference <-> sandbox -->
    <rect x="334" y="190" width="112" height="22" rx="11" fill="#ffffff" stroke="#9ca3af"/>
    <text x="390" y="205" text-anchor="middle" fill="#111827">J3 工具调用接口</text>
    <rect x="334" y="238" width="112" height="22" rx="11" fill="#ffffff" stroke="#9ca3af"/>
    <text x="390" y="253" text-anchor="middle" fill="#111827">J8 路由×隐私标签</text>
    <!-- mm <-> memory -->
    <rect x="334" y="480" width="112" height="22" rx="11" fill="#ffffff" stroke="#9ca3af"/>
    <text x="390" y="495" text-anchor="middle" fill="#111827">J1 有损驱逐入库</text>
    <rect x="334" y="528" width="112" height="22" rx="11" fill="#ffffff" stroke="#9ca3af"/>
    <text x="390" y="543" text-anchor="middle" fill="#111827">J7 索引常驻成本</text>
    <!-- inference <-> mm -->
    <rect x="112" y="334" width="196" height="22" rx="11" fill="#ffffff" stroke="#9ca3af"/>
    <text x="210" y="349" text-anchor="middle" fill="#111827">J6 适配器热插拔 × 权重分页</text>
    <rect x="112" y="382" width="196" height="22" rx="11" fill="#ffffff" stroke="#9ca3af"/>
    <text x="210" y="397" text-anchor="middle" fill="#111827">J2 共享底座记账 / 前缀隔离</text>
    <!-- sandbox <-> mm (diagonal) -->
    <rect x="324" y="359" width="132" height="22" rx="11" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4,3"/>
    <text x="390" y="374" text-anchor="middle" fill="#111827">J5 隔离的内存代价</text>
    <!-- sandbox <-> memory -->
    <rect x="514" y="359" width="194" height="22" rx="11" fill="#ffffff" stroke="#9ca3af"/>
    <text x="611" y="374" text-anchor="middle" fill="#111827">J4 记忆写入授权 / 投毒</text>
  </g>

  <!-- ========== Auxiliary subsystems ========== -->
  <rect x="790" y="72" width="190" height="538" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="885" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">辅助子系统 → 落点</text>
  <g font-size="12.5" fill="#374151">
    <text x="804" y="134" font-weight="700">事件总线</text>
    <text x="804" y="152" fill="#6b7280">沙箱 Q4 · 七要素「异步」</text>
    <text x="804" y="190" font-weight="700">命名与发现</text>
    <text x="804" y="208" fill="#6b7280">沙箱 Q4</text>
    <text x="804" y="246" font-weight="700">记账可观测</text>
    <text x="804" y="264" fill="#6b7280">内存 Q1 / Q8 · 推理 Q7</text>
    <text x="804" y="302" font-weight="700">身份薄层</text>
    <text x="804" y="320" fill="#6b7280">沙箱 Q3</text>
    <text x="804" y="358" font-weight="700">能耗</text>
    <text x="804" y="376" fill="#6b7280">推理 Q4 / Q7 · 内存 Q7</text>
    <text x="804" y="414" font-weight="700">监督界面</text>
    <text x="804" y="432" fill="#6b7280">沙箱 Q8 · 记忆 Q5</text>
    <text x="804" y="470" font-weight="700">版本兼容</text>
    <text x="804" y="488" fill="#6b7280">推理 Q7 · 记忆 Q4</text>
  </g>

  <!-- ========== Foundation band ========== -->
  <rect x="20" y="630" width="420" height="72" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="34" y="654" font-size="13" font-weight="700" fill="#374151">平台底座（借来的能力）</text>
  <text x="34" y="674" font-size="12" fill="#4b5563">内核：memcg · PSI · dma-buf · MGLRU · zram</text>
  <text x="34" y="692" font-size="12" fill="#4b5563">隔离：UID / 进程沙箱 · pKVM · TEE · NPU 驱动与 HAL</text>
  <rect x="452" y="630" width="250" height="72" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="466" y="654" font-size="13" font-weight="700" fill="#374151">硬件</text>
  <text x="466" y="674" font-size="12" fill="#4b5563">CPU / GPU / NPU（共享 LPDDR）</text>
  <text x="466" y="692" font-size="12" fill="#4b5563">UFS 闪存 · 安全单元</text>
  <rect x="714" y="630" width="266" height="72" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="728" y="654" font-size="13" font-weight="700" fill="#374151">云侧</text>
  <text x="728" y="674" font-size="12" fill="#4b5563">可信云推理（PCC 类）</text>
  <text x="728" y="692" font-size="12" fill="#4b5563">云沙箱 · 云端记忆</text>
</svg>
