    difficulties:
    - name: 系统级输入信息不足
      size: 5
      points:
      - name: 难点
        text: 系统级拿不到深度和运动向量，UI会被一起插值
      - name: 光流估计
        text: 在合成器一侧估计光流，SDK级补充运动向量
      - name: UI遮罩
        text: 按固定屏幕区域、合成层检测UI，
        highlight: 系统光流加UI遮罩
    - name: 帧预算内完成推理
      size: 5
      points:
      - name: 难点
        text: 插帧实测11–30ms，推理与渲染共享GPU，持续运行降频
      - name: 内联加速
        text: 有硬件走GPU内联加速器，无则小模型或半分辨率光流
      - name: 预算调度
        text: 按帧时间动态决定是否插帧，
        highlight: 按预算动态启停插帧
    - name: 加速器碎片化
      size: 5
      points:
      - name: 难点
        text: 四家各一套，Vulkan ML仍是厂商扩展
      - name: 算子抽象
        text: 系统图形栈内做后端抽象层，统一超分、插帧、降噪接口
      - name: 多后端
        text: 向下适配tensor / data graph路径，
        highlight: 统一算子抽象层
    milestones:
