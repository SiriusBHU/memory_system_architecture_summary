    difficulties:
    - name: 生成物与原生一致
      size: 5
      points:
      - name: 难点
        text: 字体、间距、深色、无障碍易与系统不一致
      - name: 目录约束
        text: 系统设计系统建组件目录，模型只能引用目录内组件与令牌
      - name: 校验修复
        text: 校验层拒绝或修复非法节点，
        highlight: 令牌约束的组件目录
    - name: 沙箱隔离与资源平衡
      size: 6
      points:
      - name: 难点
        text: iframe隔离强但WebView重，纯声明式表达力受限
      - name: 声明式优先
        text: 默认声明式组件目录，数据不是代码，权限逐项授权
      - name: 兜底路径
        text: 表达不足时按需创建、用完回收，
        highlight: 声明式为主兜底
    - name: 流式增量渲染不卡顿
      size: 5
      points:
      - name: 难点
        text: 组件树持续到达，每次都可能触发布局和重绘
      - name: 增量差分
        text: 只更新变化节点，布局计算移出渲染线程
      - name: 帧预算合批
        text: 约定生成顺序，可见内容优先，
        highlight: 按帧预算合批提交
