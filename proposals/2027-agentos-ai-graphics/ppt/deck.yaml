  # 14 Agent OS 总体架构
  - template: solution.solution-arch-overview
    data:
      title: Agent OS总体架构
      title_suffix: 模型内存一等公民
      takeaway: 统一记账、可回收、可共享，不加DRAM撑起Agent与应用叠加
      challenges:
        - { name: 模型内存游离, detail: 权重、KV、NPU缓冲分属不同账，回收收不走 }
        - { name: 非模型内存不足, detail: 容量被冻结，冷启动受.so页争用和锁拖累 }
        - { name: 加载驻留低效, detail: 多份拷贝、长期钉住、IO打不满，命中率不稳 }
      principles:
        - { name: 统一记账, detail: 权重、专家、KV、NPU缓冲同一本账 }
        - { name: 可回收, detail: 权重是干净文件页，KV块可压缩换出 }
        - { name: 可共享, detail: 同一份权重按内容多方共用 }
      arch:
        partitions:
          - name: KT1 智慧化内存管理
            layers:
              - name: 感知
                modules:
                  - { name: SPE冷热识别, highlight: true }
                  - { name: 页表冷证据 }
              - name: 匿名页
                modules:
                  - { name: 预取, highlight: true }
                  - { name: 换出, highlight: true }
              - name: 文件页
                modules:
                  - { name: 锁优化, highlight: true }
          - name: KT2 Agent 内存组件
            layers:
              - name: 权重
                modules:
                  - { name: 稀疏权重分层, highlight: true }
                  - { name: 热度模型, highlight: true }
              - name: KV
                modules:
                  - { name: KV块池, highlight: true }
                  - { name: 压缩换出, highlight: true }
                  - { name: 前缀复用, highlight: true }
          - name: KT3 模型翻译组件
            layers:
              - name: 布局
                modules:
                  - { name: 页对齐布局 }
              - name: 加载
                modules:
                  - { name: 大块预读 }
                  - { name: 权重内容共享, highlight: true }
              - name: 映射
                modules:
                  - { name: NPU零拷贝映射, highlight: true }
        shared:
          - name: 共享层
            modules:
              - { name: 统一模型内存记账, highlight: true }
              - { name: 预算账本, highlight: true }
              - { name: 冷热模型, highlight: true }
              - { name: IO调度队列, highlight: true }
          - name: 内核基座
            modules:
              - { name: 缺页/rmap }
              - { name: LRU }
              - { name: DAMON }
              - { name: memcg }
              - { name: zram }
              - { name: IOMMU }
      key_techs:
        - name: KT1 智慧化内存管理
          points:
            - SPE证热、页表证冷，预取与换出同源
            - 冷启动降15–30%，切回降20–40%（建议）
        - name: KT2 Agent内存组件
          points:
            - 专家缓存与KV块纳入统一记账
            - 命中率较LRU高30%，KV压缩2.5倍（建议）
        - name: KT3 模型翻译组件
          points:
            - 页对齐布局，文件页经IOMMU给NPU
            - 冷加载达UFS理论值60–70%，零额外拷贝
        - name: 仿真平台 S1/S2
          points:
            - S1云转端评估，S2单Agent并行化
            - 仿真误差在10%内，先建真机基线（建议）

  # 15 AI+图形架构
  - template: solution.solution-arch-overview
    data:
      title: AI+图形架构
      title_suffix: 预算驱动的系统级体验
      takeaway: 热稳态下稳态60FPS以上，游戏同画质功耗降20–40%（建议）
      challenges:
        - { name: 热稳态能效, detail: 量化版3DGS仅3FPS、5.89W，游戏易降频 }
        - { name: 帧预算内推理, detail: 插帧约18ms对8.3ms预算，界面要边生成边渲 }
        - { name: 碎片化, detail: 加速器四家各一套，格式与UI协议未统一 }
      principles:
        - { name: 预算驱动, detail: 温度与帧预算定画质档位 }
        - { name: 系统层优先, detail: 常驻渲染、对游戏透明 }
        - { name: 跟随标准, detail: 不做私有格式 }
      arch:
        partitions:
          - name: 3D与游戏（G1、G3）
            layers:
              - name: 3DGS
                modules:
                  - { name: 采集生成, highlight: true }
                  - { name: SPZ压缩加载 }
                  - { name: 免排序渲染, highlight: true }
              - name: 后处理
                modules:
                  - { name: 神经超分, highlight: true }
                  - { name: 神经插帧, highlight: true }
                  - { name: 降噪 }
          - name: 陪伴与交互（G2、G4）
            layers:
