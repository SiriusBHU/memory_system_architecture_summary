            - 稳态60FPS以上，功耗1.5W内（建议）
        - name: G2 常驻低功耗萌宠
          points:
            - 静止零帧、微动、互动三级渲染
            - 静止态近零功耗，常驻100–150MB（估算）
        - name: G3 神经超分与插帧
          points:
