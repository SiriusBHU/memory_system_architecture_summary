    difficulties:
    - name: 文件缺页与回收去全局锁
      size: 4.92
      points:
      - name: 难点
        text: 缺页拿folio锁、等I/O，回收拿i_mmap锁，共享库被几十个进程映射
      - name: 缺页提速
        text: 补全I/O型文件缺页的VMA锁覆盖，避开mmap_lock
      - name: 回收降阻
        text: 热.so页trylock批量跳过，不阻塞kswapd，
        highlight: 共享库页脱离全局锁
    - name: 软保护与回收的平衡
      size: 4.27
      points:
      - name: 难点
        text: 保护多了匿名页换出腾不出空间；单独预加载使冷启动次数增30%
      - name: 画像保护
        text: 按启动画像生成关键.so页集合，软保护不用mlock
      - name: 统一预算
        text: 受memcg与全局上限约束，与匿名页换出共账本，
        highlight: 有预算的软保护
    - name: 大folio与碎片的权衡
      size: 3.62
      points:
      - name: 难点
        text: 大folio减缺页与TLB缺失，但要连续物理内存，手机碎片严重
      - name: 热段大页
        text: 仅对关键.so热段请求contpte对齐的folio
      - name: 优雅降级
        text: 分配失败退回小页，
        highlight: 热段大页冷段小页
    milestones:
