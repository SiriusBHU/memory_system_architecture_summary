  data:
    title: KV Cache回收与压缩：
    title_suffix: KV块化记账加分级压缩，常驻压缩≥2.5倍
    challenges:
    - name: 钉住不可回收
      text: KV在回收路径之外，易提前触发查杀。
    - name: 随上下文增长
      text: 4B稠密32K的KV约4.5GiB（估算）。
    - name: 压缩有质量风险
      text: 2-bit在工具调用上未充分验证
