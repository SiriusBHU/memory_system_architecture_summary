    - name: 换出准确率
      size: 4.92
      points:
      - name: 难点
        text: 换出热页要付压缩再解压的代价，还可能触发lmkd
      - name: 证据一致
        text: 须同时满足：无SPE热证据、访问位为0、代龄达标，
        highlight: 多证据一致才换出
      - name: 闭环预算
        text: 按应用memcg设配额，先换已进后台且冷的应用，PSI反馈控量
    - name: 压缩、CPU与闪存的预算博弈
      size: 4.27
      points:
      - name: 难点
        text: 不可压缩页占DRAM又压不下；写回带来闪存写放大与寿命问题
      - name: 分流
        text: 可压缩冷页进zram（可二次压缩），不可压缩且长期空闲页限额写回，
        highlight: 按可压缩性分流
      - name: 写入封顶
        text: 按日写入量设上限，与KT1-a共用一本账
    - name: 与内核既有回收协同
      size: 3.62
      points:
      - name: 难点
        text: 回收路径与厂商hook复杂，内核swap子系统本身也在重构
      - name: 冷页注入
        text: 用memory.reclaim或DAMOS作入口注入冷页清单，策略放用户态，
        highlight: 不改内核主路径
    milestones:
