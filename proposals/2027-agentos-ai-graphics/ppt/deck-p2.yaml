    difficulties:
    - name: KV块化记账
      size: 3.62
      points:
      - name: 难点
        text: KV在dma-buf或NPU缓冲里，不在LRU上，回收不了
      - name: 块池
        text: 按16 token一块切分，纳入统一记账与分配
      - name: 回收接口
        text: 每块可压缩、换出，或丢弃后重算，
        highlight: KV成为可回收对象
    - name: 容忍度分级压缩
      size: 4.27
      points:
      - name: 难点
        text: 2-bit量化与淘汰对工具调用、长推理的影响未知
      - name: 敏感度评估
        text: 按块评估压缩容忍度并分级
      - name: 差异精度
        text: 关键块保持高精度，系统提示、旧工具输出用低位宽，
        highlight: 按块差异化压缩
    - name: 换出与重算择优
      size: 3.62
      points:
      - name: 难点
        text: UFS带宽比DRAM低一个数量级，换出要掩盖延迟
      - name: 预载预测
        text: 只换出长期不被关注的块，用元数据预测提前预载
      - name: 重算择优
        text: 带宽不够选重算，跨会话复用固定前缀，
        highlight: IO与重算择优
