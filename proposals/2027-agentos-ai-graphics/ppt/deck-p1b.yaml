  # 17 2027 交付节奏
  - template: solution.roadmap-matrix
    data:
      title: 2027交付：
      title_suffix: 先建真机基线，再把建议区间定为承诺值
      goals:
        - name: （1）真机基线
          text: 2027Q1建成标准负载集、体验指标和真机基线，是KT1至KT3、G1至G4的共同前置
        - name: （2）承诺值
          text: 基线建成后，把各技术的「建议区间」定为承诺值，再分季度合入内部版本
        - name: （3）决策点
          text: Q1完成SPE可用性摸底，并与SoC厂商确认NPU IOMMU映射可行性
      generations:
        - { name: 2027Q1, theme: 建基线、做摸底 }
        - { name: 2027Q2, theme: 原型与策略 }
        - { name: 2027Q3, theme: 合入内部版本 }
        - { name: 2027Q4, theme: 统一接口与验证 }
      rows:
        - name: 系统内存
          cells:
            - items:
                - { name: KT1, text: 冷启动基线、SPE摸底 }
            - items:
                - { name: KT1-a, text: 锁路径优化、软保护 }
                - { name: KT1-b/c, text: 冷热模型、预取 }
            - items:
                - { name: KT1, text: 合入，KT1-a商用 }
            - items:
                - { name: KT1, text: 未排期，待确认 }
        - name: 模型内存
          cells:
            - items:
                - { name: KT2, text: 专家基线、KV块池 }
                - { name: KT3, text: 加载基线、IOMMU }
            - items:
                - { name: KT2, text: 自适应预取、KV压缩 }
                - { name: KT3, text: 页对齐、大块预读 }
            - items:
                - { name: KT2-B, text: 闪存换出、重算 }
                - { name: KT3, text: NPU零拷贝、共享 }
            - items:
                - { name: KT2-A, text: 稀疏权重统一接口 }
        - name: 仿真平台
          cells:
            - items:
                - { name: S1, text: 负载集、真机基线 }
            - items:
                - { name: S1, text: 仿真v1与校准报告 }
                - { name: S2, text: 工具标签、依赖图 }
            - items:
                - { name: S1, text: 云转端决策与翻转点 }
                - { name: S2, text: 带宽模型、并行上限 }
            - items:
                - { name: S2, text: 策略模板上线验证 }
